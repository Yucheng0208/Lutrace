<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>光痕</title>
  <meta name="description" content="把生活的氛圍留在照片邊框上：30 種個性風格，加上天氣、時間、地點與小語錄。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17151d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // 舊版（guanghen.*）的設定搬到 lutrace.*，只在新 key 不存在時搬一次
    try { ['settings', 'uiTheme', 'tab', 'lang'].forEach(function (k) { var v = localStorage.getItem('guanghen.' + k); if (v !== null) { if (localStorage.getItem('lutrace.' + k) === null) localStorage.setItem('lutrace.' + k, v); localStorage.removeItem('guanghen.' + k); } }); } catch (e) {}
    try { var t = localStorage.getItem('lutrace.uiTheme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=DM+Serif+Display:ital@0;1&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&family=Saira:wght@100..900&family=Space+Mono:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=18">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icons/icon.svg?v=2" alt="" width="40" height="40">
      <div>
        <h1 id="brand-name" translate="no"><span class="brand-zh">光痕</span></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="kofi-btn kofi-top" href="https://ko-fi.com/G3K3292RM5" target="_blank" rel="noopener" data-i18n-aria="kofi" data-i18n-title="kofi">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11.351 2.715c-2.7 0-4.986.025-6.83.26C2.078 3.285 0 5.154 0 8.61c0 3.506.182 6.13 1.585 8.493 1.584 2.701 4.233 4.182 7.662 4.182h.83c4.209 0 6.494-2.234 7.637-4a9.5 9.5 0 0 0 1.091-2.338C21.792 14.688 24 12.22 24 9.208v-.415c0-3.247-2.13-5.507-5.792-5.87-1.558-.156-2.65-.208-6.857-.208m0 1.947c4.208 0 5.09.052 6.571.182 2.624.311 4.13 1.584 4.13 4v.39c0 2.156-1.792 3.844-3.87 3.844h-.935l-.156.649c-.208 1.013-.597 1.818-1.039 2.546-.909 1.428-2.545 3.064-5.922 3.064h-.805c-2.571 0-4.831-.883-6.078-3.195-1.09-2-1.298-4.155-1.298-7.506 0-2.181.857-3.402 3.012-3.714 1.533-.233 3.559-.26 6.39-.26m6.547 2.287c-.416 0-.65.234-.65.546v2.935c0 .311.234.545.65.545 1.324 0 2.051-.754 2.051-2s-.727-2.026-2.052-2.026m-10.39.182c-1.818 0-3.013 1.48-3.013 3.142 0 1.533.858 2.857 1.949 3.897.727.701 1.87 1.429 2.649 1.896a1.47 1.47 0 0 0 1.507 0c.78-.467 1.922-1.195 2.623-1.896 1.117-1.039 1.974-2.364 1.974-3.897 0-1.662-1.247-3.142-3.039-3.142-1.065 0-1.792.545-2.338 1.298-.493-.753-1.246-1.298-2.312-1.298"/></svg>
        <span data-i18n="kofi"></span>
      </a>
      <select id="ui-theme" class="mini-select" data-i18n-aria="ui.theme">
        <option value="auto" data-i18n="ui.theme.auto"></option>
        <option value="light" data-i18n="ui.theme.light"></option>
        <option value="dark" data-i18n="ui.theme.dark"></option>
      </select>
      <select id="ui-lang" class="mini-select" data-i18n-aria="ui.language" translate="no"></select>
      <label id="add-btn" class="btn btn-primary add-btn" for="file-input">
        <svg class="mobile-only" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="btn-label" data-i18n="btn.add"></span>
      </label>
      <button id="save-top" class="btn btn-primary save-top" type="button" disabled data-i18n="btn.saveShort"></button>
      <input id="file-input" type="file" accept="image/*,video/*,.mov,.mp4,.m4v,.mkv,.avi,.wmv,.webm,.flv,.mpg,.mpeg,.ts,.mts,.m2ts,.3gp,.ogv,.gif,.svg,.webp,.heic,.heif,.hif,.dng,.nef,.nrw,.cr2,.cr3,.crw,.arw,.srf,.sr2,.raf,.orf,.rw2,.rwl,.pef,.srw,.x3f,.3fr,.fff,.iiq,.erf,.mrw,.kdc,.dcr,.mos,.mef,.gpr" multiple hidden>
    </div>
  </header>

  <main class="layout">
    <aside class="panel list-panel">
      <div class="panel-head">
        <h2><span data-i18n="list.title"></span> <span id="count" class="muted">0</span></h2>
        <button id="remove-all" class="btn btn-ghost btn-sm" type="button" data-i18n="list.removeAll"></button>
      </div>
      <form id="url-form" class="url-form">
        <input id="url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false" data-i18n-placeholder="url.placeholder" data-i18n-aria="url.placeholder">
        <button class="btn btn-ghost btn-sm" type="submit" data-i18n="btn.urlAdd"></button>
      </form>
      <p class="hint url-hint" data-i18n="url.hint"></p>
      <ul id="photo-list" class="photo-list"></ul>
    </aside>

    <section class="stage-panel">
      <div id="stage-busy" class="stage-busy" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="stage-busy-text"></span>
      </div>
      <div id="dropzone" class="dropzone">
        <div>
          <div class="dz-cards" aria-hidden="true">
            <span class="dz-card c1"><svg viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5" class="fill"/><circle cx="16.5" cy="15.5" r="2.5" class="fill"/></svg></span>
            <span class="dz-card c2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" class="fill"/><path d="M12 6.5a5.5 5.5 0 0 1 5.5 5.5"/></svg></span>
            <span class="dz-card c3"><svg viewBox="0 0 24 24"><path d="M12 3.5c.6 4.6 3.9 7.9 8.5 8.5-4.6.6-7.9 3.9-8.5 8.5-.6-4.6-3.9-7.9-8.5-8.5 4.6-.6 7.9-3.9 8.5-8.5z" class="fill"/></svg></span>
          </div>
          <button id="dz-add" class="dz-add" type="button" data-i18n-aria="btn.add">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <p class="dz-title" data-i18n="drop.title"></p>
          <p class="muted dz-desc" data-i18n="drop.desc"></p>
        </div>
      </div>

      <div id="stage" class="stage" hidden>
        <div class="stage-toolbar">
          <div class="seg">
            <button id="mode-preview" class="seg-btn active" type="button" data-i18n="mode.preview"></button>
            <button id="mode-crop" class="seg-btn" type="button" data-i18n="mode.crop"></button>
          </div>
          <button id="play-toggle" class="btn btn-ghost btn-sm play-btn" type="button" hidden aria-label="Play / pause">❚❚</button>
          <span id="dims" class="muted dims"></span>
        </div>
        <div id="preview-wrap" class="canvas-wrap">
          <canvas id="preview"></canvas>
        </div>
        <div id="crop-wrap" class="crop-wrap" hidden>
          <div id="crop-area" class="crop-area">
            <img id="crop-img" alt="">
            <div id="crop-box" class="crop-box">
              <span class="grid"></span>
              <span class="h nw" data-h="nw"></span><span class="h n" data-h="n"></span>
              <span class="h ne" data-h="ne"></span><span class="h e" data-h="e"></span>
              <span class="h se" data-h="se"></span><span class="h s" data-h="s"></span>
              <span class="h sw" data-h="sw"></span><span class="h w" data-h="w"></span>
            </div>
          </div>
          <div class="crop-controls">
            <div class="chips" id="ratio-chips">
              <button class="chip" data-ratio="tpl" type="button" data-i18n="crop.tpl"></button>
              <button class="chip" data-ratio="free" type="button" data-i18n="crop.free"></button>
              <button class="chip" data-ratio="1" type="button">1:1</button>
              <button class="chip" data-ratio="4/5" type="button">4:5</button>
              <button class="chip" data-ratio="3/4" type="button">3:4</button>
              <button class="chip" data-ratio="4/3" type="button">4:3</button>
              <button class="chip" data-ratio="3/2" type="button">3:2</button>
              <button class="chip" data-ratio="9/16" type="button">9:16</button>
              <button class="chip" data-ratio="16/9" type="button">16:9</button>
            </div>
            <div class="crop-actions">
              <button id="crop-reset" class="btn btn-ghost" type="button" data-i18n="crop.reset"></button>
              <button id="crop-done" class="btn btn-primary" type="button" data-i18n="crop.done"></button>
            </div>
          </div>
          <p id="crop-hint" class="hint crop-hint" hidden></p>
        </div>
      </div>
    </section>

    <aside id="settings-panel" class="panel settings-panel" data-tab="style">
      <nav class="inspector-tabs desktop-only" role="tablist" data-i18n-aria="tab.label">
        <button class="itab" role="tab" data-tab="style" type="button" data-i18n="tab.style"></button>
        <button class="itab" role="tab" data-tab="text" type="button" data-i18n="tab.text"></button>
        <button class="itab" role="tab" data-tab="place" type="button" data-i18n="tab.place"></button>
        <button class="itab" role="tab" data-tab="export" type="button" data-i18n="tab.export"></button>
      </nav>

      <section class="group" data-tab="style">
        <h2 data-i18n="sec.look"></h2>
        <div class="field" id="skin-field">
          <label data-i18n="f.skin"></label>
          <div class="pal-carousel">
            <button id="pal-prev" class="pal-nav prev" type="button" aria-label="Previous">‹</button>
            <div id="skin-chips" class="pal-grid"></div>
            <button id="pal-next" class="pal-nav next" type="button" aria-label="Next">›</button>
          </div>
          <div id="pal-dots" class="pal-dots" aria-hidden="true"></div>
        </div>
        <div class="field" id="mode-field" hidden>
          <label data-i18n="f.mode"></label>
          <div id="mode-chips" class="seg seg-full"></div>
        </div>
        <div class="field">
          <label data-i18n="f.accent"></label>
          <div class="color-row">
            <button class="chip-color" data-accent="auto" type="button" data-i18n="f.accent.auto"></button>
            <button class="swatch swatch-grad" data-accent="gradient" type="button" data-i18n-aria="f.accent.grad" data-i18n-title="f.accent.grad"></button>
            <button class="swatch" data-accent="#ff5c8a" type="button" style="--sw:#ff5c8a" aria-label="Pink"></button>
            <button class="swatch" data-accent="#7a5cff" type="button" style="--sw:#7a5cff" aria-label="Purple"></button>
            <button class="swatch" data-accent="#2fb8ff" type="button" style="--sw:#2fb8ff" aria-label="Blue"></button>
            <button class="swatch" data-accent="#21c58e" type="button" style="--sw:#21c58e" aria-label="Green"></button>
            <button class="swatch" data-accent="#ffb020" type="button" style="--sw:#ffb020" aria-label="Orange"></button>
            <label class="swatch swatch-picker" data-i18n-title="f.colorPicker"><input id="accent-picker" type="color" value="#ff5c8a" data-i18n-aria="f.colorPicker"></label>
          </div>
          <div id="grad-editor" class="grad-editor" hidden>
            <div id="grad-bar" class="grad-bar"></div>
            <div class="grad-row">
              <div id="grad-stops" class="grad-stops"></div>
              <span id="grad-count" class="muted small"></span>
              <button id="grad-remove" class="btn btn-ghost btn-sm icon-btn" type="button" data-i18n-aria="f.grad.remove" data-i18n-title="f.grad.remove">−</button>
              <button id="grad-add" class="btn btn-ghost btn-sm icon-btn" type="button" data-i18n-aria="f.grad.add" data-i18n-title="f.grad.add">＋</button>
            </div>
          </div>
          <p class="hint" data-i18n="f.accent.hint"></p>
        </div>
        <label class="check"><input id="opt-stamp" type="checkbox"><span data-i18n="f.stamp"></span></label>
      </section>
      <section class="group" data-tab="style" id="anim-group" hidden>
        <h2 data-i18n="sec.anim"></h2>
        <p class="hint" data-i18n="a.hint" style="margin-top:-4px;margin-bottom:10px"></p>
        <label class="check" style="margin-top:0;margin-bottom:12px"><input id="a-preview" type="checkbox"><span data-i18n="a.preview"></span></label>
        <div class="field">
          <label for="a-seconds"><span data-i18n="a.seconds"></span> <span id="a-seconds-val" class="muted"></span></label>
          <input id="a-seconds" type="range" min="3" max="30" step="1" value="10">
        </div>
        <div class="grid2">
          <div class="field"><label for="a-songlen" data-i18n="a.songLen"></label><input id="a-songlen" inputmode="numeric" autocomplete="off" placeholder="3:24"></div>
          <div class="field"><label for="a-start"><span data-i18n="a.start"></span> <span id="a-start-val" class="muted"></span></label><input id="a-start" type="range" min="0" max="95" step="1" value="35"></div>
        </div>
      </section>
      <section class="group" data-tab="style" id="textstyle-group" hidden>
        <h2 data-i18n="sec.textStyle"></h2>
        <div class="field">
          <label data-i18n="ts.font"></label>
          <div class="chips wrap-chips" id="ts-font">
            <button class="chip" data-ts-font="round" type="button" data-i18n="ts.font.round"></button>
            <button class="chip" data-ts-font="sans" type="button" data-i18n="ts.font.sans"></button>
            <button class="chip" data-ts-font="serif" type="button" data-i18n="ts.font.serif"></button>
            <button class="chip" data-ts-font="pixel" type="button" data-i18n="ts.font.pixel"></button>
            <button class="chip" data-ts-font="hand" type="button" data-i18n="ts.font.hand"></button>
          </div>
        </div>
        <div class="field">
          <label for="ts-weight"><span data-i18n="ts.weight"></span> <span id="ts-weight-val" class="muted"></span></label>
          <input id="ts-weight" type="range" min="100" max="900" step="100" value="700">
        </div>
        <div class="field">
          <label data-i18n="ts.color"></label>
          <div class="color-row">
            <button class="chip-color" data-ts-color="auto" type="button" data-i18n="ts.color.auto"></button>
            <button class="swatch" data-ts-color="#ffffff" type="button" style="--sw:#ffffff" aria-label="White"></button>
            <button class="swatch" data-ts-color="#111111" type="button" style="--sw:#111111" aria-label="Black"></button>
            <button class="swatch" data-ts-color="#ffd6e8" type="button" style="--sw:#ffd6e8" aria-label="Pink"></button>
            <button class="swatch" data-ts-color="#c9f2ff" type="button" style="--sw:#c9f2ff" aria-label="Ice"></button>
            <button class="swatch" data-ts-color="#fff3b0" type="button" style="--sw:#fff3b0" aria-label="Lemon"></button>
            <label class="swatch swatch-picker ts-picker" data-i18n-title="f.colorPicker"><input id="ts-color-picker" type="color" value="#ffffff" data-i18n-aria="f.colorPicker"></label>
          </div>
        </div>
        <div class="field">
          <label data-i18n="ts.panel"></label>
          <div class="chips wrap-chips" id="ts-panel">
            <button class="chip" data-ts-panel="liquid" type="button" data-i18n="ts.panel.liquid"></button>
            <button class="chip" data-ts-panel="frost" type="button" data-i18n="ts.panel.frost"></button>
            <button class="chip" data-ts-panel="blur" type="button" data-i18n="ts.panel.blur"></button>
            <button class="chip" data-ts-panel="gradient" type="button" data-i18n="ts.panel.gradient"></button>
            <button class="chip" data-ts-panel="solid" type="button" data-i18n="ts.panel.solid"></button>
          </div>
        </div>
      </section>

      <!-- 風格：模板清單（目前模板的選項放在上方） -->
      <section class="group" data-tab="style">
        <h2><span data-i18n="sec.template"></span> <span id="tpl-count" class="muted small"></span></h2>
        <div class="tpl-filter chips" id="tpl-filter">
          <button class="chip active" data-filter="all" type="button" data-i18n="tpl.all"></button>
          <button class="chip" data-filter="music" type="button" data-i18n="tpl.music"></button>
          <button class="chip" data-filter="photo" type="button" data-i18n="tpl.photo"></button>
          <button class="chip" data-filter="fun" type="button" data-i18n="tpl.fun"></button>
        </div>
        <div id="tpl-grid" class="tpl-grid"></div>
      </section>
      <!-- 文字 -->
      <section class="group" data-tab="text">
        <h2 data-i18n="sec.quote"></h2>
        <div class="quote-card">
          <div class="mood-row">
            <span id="mood-tag" class="mood-tag"></span>
            <button id="quote-gen" class="btn btn-gradient btn-sm" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z" fill="currentColor"/></svg>
              <span data-i18n="q.gen"></span>
            </button>
          </div>
          <textarea id="f-quote" rows="2" maxlength="80" data-i18n-placeholder="q.placeholder"></textarea>
          <div class="field mt-s" style="margin-bottom:0">
            <label data-i18n="q.style"></label>
            <div class="seg seg-full">
              <button class="seg-btn" data-quote-style="auto" type="button" data-i18n="q.style.auto"></button>
              <button class="seg-btn" data-quote-style="quote" type="button" data-i18n="q.style.quote"></button>
              <button class="seg-btn" data-quote-style="lyric" type="button" data-i18n="q.style.lyric"></button>
            </div>
          </div>
          <p class="hint" data-i18n="q.hint"></p>
          <p class="hint" data-i18n="q.style.hint"></p>
        </div>
        <div class="grid2 mt-s">
          <div class="field"><label for="f-artist" data-i18n="f.artist"></label><input id="f-artist" maxlength="40" autocomplete="off" data-i18n-placeholder="f.artist.ph"></div>
          <div class="field"><label for="f-album" data-i18n="f.album"></label><input id="f-album" maxlength="30" autocomplete="off" data-i18n-placeholder="f.album.ph"></div>
        </div>
        <p class="hint" data-i18n="f.artist.hint"></p>
      </section>
      <section class="group" data-tab="text">
        <h2 data-i18n="sec.lyrics"></h2>
        <form id="lyr-form" class="song-form">
          <input id="lyr-input" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="lyr.ph" data-i18n-aria="lyr.ph">
          <button class="btn btn-gradient btn-sm" type="submit" data-i18n="song.search"></button>
        </form>
        <p id="lyr-status" class="hint"></p>
        <ul id="lyr-results" class="song-results"></ul>
        <div id="lyr-pick" class="lyr-pick" hidden>
          <div class="lyr-head">
            <span id="lyr-song" class="lyr-song"></span>
            <button id="lyr-back" class="btn btn-ghost btn-sm" type="button" data-i18n="lyr.back"></button>
          </div>
          <p class="hint" data-i18n="lyr.tip"></p>
          <ol id="lyr-lines" class="lyr-lines"></ol>
          <div class="row mt-s">
            <span id="lyr-sel" class="muted small" style="flex:1"></span>
            <button id="lyr-apply" class="btn btn-gradient btn-sm" type="button" data-i18n="lyr.apply" disabled></button>
          </div>
        </div>
        <p class="hint" data-i18n="lyr.hint"></p>
      </section>
      <section class="group" data-tab="text">
        <h2 data-i18n="sec.song"></h2>
        <form id="song-form" class="song-form">
          <input id="song-input" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="song.ph" data-i18n-aria="song.ph">
          <button class="btn btn-gradient btn-sm" type="submit" data-i18n="song.search"></button>
        </form>
        <p id="song-status" class="hint"></p>
        <ul id="song-results" class="song-results"></ul>
        <p class="hint" data-i18n="song.hint"></p>
      </section>
      <section class="group" data-tab="text">
        <h2 data-i18n="sec.show"></h2>
        <div id="show-toggles" class="toggles">
          <label class="toggle"><input type="checkbox" data-show="quote"><span data-i18n="show.quote"></span></label>
          <label class="toggle"><input type="checkbox" data-show="date"><span data-i18n="show.date"></span></label>
          <label class="toggle"><input type="checkbox" data-show="time"><span data-i18n="show.time"></span></label>
